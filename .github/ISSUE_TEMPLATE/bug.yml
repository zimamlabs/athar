name: Bug report
description: Something in Athar does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Athar version and system
      placeholder: "for example 0.1.0 on Android 14 or Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, steps to repeat it, or a file that triggers it. Do not paste private data.
